name: Publish main website

on:
  push:
    branches: [master]
    paths:
      - index.html
      - .nojekyll
      - assets/nikita-kalgushkin-resume.pdf
      - vendor/**
      - .github/workflows/publish-main-website.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-sfill-main-website
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'SFill/my-newyork-building' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: source
          persist-credentials: false

      - name: Prepare website files
        run: |
          mkdir -p site/assets site/vendor
          cp source/index.html source/.nojekyll site/
          cp source/assets/nikita-kalgushkin-resume.pdf site/assets/
          cp source/vendor/three.min.js source/vendor/three-LICENSE.txt site/vendor/

      - name: Check out publishing branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: SFill/sfill.github.io
          ref: my-newyork-building
          ssh-key: ${{ secrets.PAGES_DEPLOY_KEY }}
          path: published

      - name: Publish website files
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          rsync -a --delete --exclude='.git/' site/ published/
          cd published
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if git diff --cached --quiet; then
            echo 'Website files are already up to date.'
            exit 0
          fi
          git commit -m "Publish tower website from SFill/my-newyork-building@${SOURCE_SHA}"
          git push origin HEAD:refs/heads/my-newyork-building
